<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#18202b; --muted:#59667a; --line:#d6dde7; --soft:#e5edf7;
  --accent:#1f5a96; --ok:#1d7a3e; --warn:#9a5800; --bad:#b3261e; --info:#1f5f99;
  --font:"Shruti","Nirmala UI","Noto Sans Gujarati","Lohit Gujarati",system-ui,sans-serif; color-scheme:light;

*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:84px}
h1,h2,h3{margin:0;text-wrap:balance} h2{font-size:1.12rem} h3{font-size:1rem;margin:10px 0 4px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0}
.bar h1{font-size:1rem;font-weight:700;line-height:1.25}
.bar h1 small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.bad{background:#fde8e6;color:var(--bad)} .pill.warn{background:#fff1dc;color:var(--warn)} .pill.ok{background:#dff3e6;color:var(--ok)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;min-height:38px;display:inline-flex;align-items:center}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn.small{min-height:36px;padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=search],input[type=email],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
textarea{min-height:90px}
input:disabled,select:disabled,textarea:disabled{background:#f1f3f5;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0;padding:14px}
.card>h2{color:var(--accent);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px} .field>label,.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.msg{margin:10px 0;padding:10px 14px;border-radius:10px;border-left:5px solid var(--accent);background:var(--surface);font-weight:500}
.msg.ok{border-color:var(--ok)} .msg.warn{border-color:var(--warn);background:#fff8ec} .msg.bad{border-color:var(--bad);background:#fdf1ef}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.82rem;color:var(--muted)}
.progress{height:16px;border-radius:999px;background:var(--soft);overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--accent)}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);position:sticky;top:0;z-index:1}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.badge{display:inline-block;border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-ok{background:#dff3e6;color:var(--ok)} .b-warn{background:#fff1dc;color:var(--warn)} .b-bad{background:#fde8e6;color:var(--bad)} .b-mut{background:#eceff3;color:var(--muted)} .b-info{background:#e3eef9;color:var(--info)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
.filters .field{min-width:140px;flex:1}
.idbig{font-size:1.9rem;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:var(--accent)}
.secnav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:thin}
.secnav button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap;min-height:36px}
.secnav button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.secnav button i{font-style:normal;font-size:.72rem;color:var(--muted);margin-left:4px}
.secnav button.full i{color:var(--ok)}
.qsec{display:none} .qsec.on{display:block}
.part{font-weight:700;color:var(--muted);font-size:.85rem}
.stitle{font-size:1.08rem;font-weight:700;color:var(--accent);margin:2px 0 6px}
.intro{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)} .q:last-child{border-bottom:0}
.qt{font-weight:600}
.qv{font-family:ui-monospace,Consolas,monospace;font-size:.68rem;color:var(--muted);margin-left:6px}
.qhint{font-size:.78rem;color:var(--muted)}
.qwarn{font-size:.82rem;color:var(--warn);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);cursor:pointer;user-select:none}
.chip input[type=checkbox]+span::before{content:"";width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;flex:none}
.chip input[type=radio]+span::before{content:"";width:16px;height:16px;border:2px solid var(--muted);border-radius:50%;flex:none}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.chip input:checked+span::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px var(--accent)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.chip input:disabled+span{cursor:not-allowed;opacity:.75}
.othbox{display:flex;gap:6px;align-items:center;flex:1 1 240px}
.othbox span{font-size:.85rem;color:var(--muted);white-space:nowrap}
.quick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0}
.quick input{max-width:340px;font-family:ui-monospace,Consolas,monospace;letter-spacing:.12em}
.rt{width:100%;border-collapse:collapse;margin-top:6px}
.rt th{font-size:.78rem;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.rt th:nth-child(2){text-align:left}
.rt td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:middle}
.rt td.n{width:64px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.rt td.c{text-align:center;width:84px}
.rt label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;cursor:pointer}
.rt label:hover{background:var(--soft)}
.rt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.rt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none}
.rt .mn{display:none;color:var(--muted);margin-right:6px}
.rt input:checked+.dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.rt input:focus-visible+.dot{outline:3px solid var(--accent);outline-offset:2px}
.rt .ml{display:none}
.rt tr.blank td.it{border-left:3px solid #f0c27a;padding-left:6px}
@media (max-width:620px){
  .rt thead{display:none} .rt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);padding:8px 0;gap:4px}
  .rt td{border:0;padding:0} .rt td.it{grid-column:1 / -1} .rt td.n{display:none} .rt .mn{display:inline!important}
  .rt td.c{width:auto} .rt .ml{display:block;font-size:.72rem;color:var(--muted);margin-left:6px}
  .rt label{justify-content:flex-start;padding-left:6px;border:1px solid var(--line)}
  .rt tr.blank td.it{border-left:0;padding-left:0}
}
.rank{display:grid;grid-template-columns:1fr 110px;gap:6px;align-items:center;max-width:460px;margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.savebar .wrap{display:flex;gap:8px;align-items:center;padding:8px 14px}
.savebar .st{flex:1;font-size:.85rem;color:var(--muted);min-width:0}
.instr li{margin:4px 0}
.chart .row{display:grid;grid-template-columns:minmax(110px,38%) 1fr 74px;gap:8px;align-items:center;font-size:.85rem;margin:3px 0}
.chart .bar{height:16px;background:var(--accent);border-radius:4px;min-width:2px}
.chart .num{font-variant-numeric:tabular-nums;text-align:right}
.center{max-width:460px;margin:40px auto}
.spick3{display:grid;grid-template-columns:1.3fr 1.3fr .8fr;gap:6px}
.spick .code{font-size:1.15rem;color:var(--accent);letter-spacing:.04em}
/* fast entry */
.fx{max-width:640px;margin:0 auto}
.fx .top{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fx .top .wide{grid-column:1 / -1}
.fx .idnext{font-size:1.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.fx .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.fx .step{min-height:118px}
.fx .slab{font-size:.8rem;font-weight:700;color:var(--muted)}
.fx .stext{font-size:1.08rem;font-weight:600;margin:4px 0 10px;line-height:1.45;min-height:3em}
.fx .keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx .keys.list{grid-template-columns:1fr 1fr}
.fx .key{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:68px;padding:6px 8px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit;color:inherit}
.fx .keys.list .key{min-height:54px;flex-direction:row;justify-content:flex-start;text-align:left;gap:8px;font-weight:600}
.fx .key b{font-size:1.35rem;line-height:1;color:var(--accent)}
.fx .key span{font-size:.82rem}
.fx .keys.list .key b{font-size:1.05rem;min-width:22px}
.fx .key.on{background:var(--accent);border-color:var(--accent);color:#fff} .fx .key.on b{color:#fff}
.fx .key:active{transform:scale(.97)}
.fx .nav3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.fx .nav3 .btn{min-height:50px}
.fx .strip{display:flex;flex-direction:column;gap:6px}
.fx .srow{display:flex;gap:6px;align-items:flex-start}
.fx .srow>span{flex:none;width:58px;font-size:.72rem;color:var(--muted);font-weight:700;padding-top:4px}
.fx .cells{display:flex;flex-wrap:wrap;gap:3px}
.fx .cell{min-width:24px;height:26px;padding:0 3px;border:1px solid var(--line);border-radius:6px;font-size:.78rem;display:inline-flex;align-items:center;justify-content:center;background:#fff8e6;cursor:pointer;font-variant-numeric:tabular-nums;font-family:inherit;color:var(--muted)}
.fx .cell.f{background:var(--soft);color:var(--ink);font-weight:700}
.fx .cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.fx .cell.w{background:#fde8e6;color:var(--bad)}
.fx .bar2{height:8px;border-radius:999px;background:var(--soft);overflow:hidden} .fx .bar2 i{display:block;height:100%;background:var(--accent);transition:width .15s}
.fx .done{text-align:center;border-color:var(--ok)} .fx .done .idbig{font-size:2.4rem}

.note{font-size:.85rem;color:var(--muted)}
code{font-size:.85em;background:var(--soft);padding:0 4px;border-radius:4px;word-break:break-all}
details>summary{cursor:pointer;font-weight:600;color:var(--accent)}
[hidden]{display:none!important}
.ovl{position:fixed;inset:0;z-index:100;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{max-width:460px;width:100%;margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
