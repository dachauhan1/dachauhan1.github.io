<style>

main{max-width:1100px;margin:0 auto;padding:12px}

.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
input[type=text],input[type=url],select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}

.src b{display:block}
.note{color:var(--mut);font-size:14px}

.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.t th{background:#eef2f8}.num{text-align:right!important;white-space:nowrap}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tabs .btn.on{background:var(--pri);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi div{background:#eef2f8;border-radius:10px;padding:10px}.kpi b{font-size:22px;display:block}
.dec{font-weight:bold}.dec.rej{color:var(--bad)}.dec.acc{color:var(--ok)}
</style>
