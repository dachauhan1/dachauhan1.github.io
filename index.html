<style>

.field{display:flex;flex-direction:column;gap:3px} .field>label,.lbl{font-size:.8rem;color:var(--muted);font-weight:600}

.othbox{display:flex;gap:6px;align-items:center;flex:1 1 240px}
.othbox span{font-size:.85rem;color:var(--muted);white-space:nowrap}

.rt{width:100%;border-collapse:collapse;margin-top:6px}

const FB_COL = c => c === "users" ? "users" : "s23_" + c;
function fbAdapter(F, fdb){
  const ref = path => { const i = path.indexOf("/"); return F.doc(fdb, FB_COL(path.slice(0, i)), path.slice(i + 1)); };
  const snap = sn => ({docs:sn.docs.map(x => ({id:x.id, data:() => x.data()})), metadata:sn.metadata || {}});
  const q = (c, cons) => ({
    where:(f, op, v) => q(c, cons.concat([F.where(f, op, v)])), orderBy:(f, d) => q(c, cons.concat([F.orderBy(f, d)])), limit:n => q(c, cons.concat([F.limit(n)])),
    add:d => F.addDoc(F.collection(fdb, FB_COL(c)), d),
    onSnapshot:(next, err) => F.onSnapshot(F.query(F.collection(fdb, FB_COL(c)), ...cons), {includeMetadataChanges:true}, sn => next(snap(sn)), err)});
  return {doc:path => ({get:async () => { const x = await F.getDoc(ref(path)); return {id:x.id, exists:x.exists(), data:() => x.data()}; },
                       set:d => F.setDoc(ref(path), d), delete:() => F.deleteDoc(ref(path))}),
          collection:c => q(c, [])};
}

function codebookRows(){
  const R = [];
  const add = o => R.push(Object.assign({table:"", sec:"", no:"", gu:"", en:"", type:"", codes:"", missing:"", level:"nominal", rc:"", construct:"", leg:"", spss:true, fmt:"F2.0"}, o));
  const M = `${INVALID} = Invalid (multiple marks / invalid rank); ${NORESP} = No response`;
  add({name:"STUDENT_ID", table:"Student_Master", gu:"વિદ્યાર્થી ID (અનામી)", en:"Anonymous student ID", type:"ID", codes:"school code + serial, e.g. AGS01-001", fmt:"A12"});
  add({name:"SCHOOL_ID", table:"Student_Master", no:"(3)", gu:"શાળા ID", en:"School code (district letter + type + S + number)", type:"ID", codes:"VT/A/B/N + G/GIA/P + S + 01…, e.g. AGS01 = Ahmedabad Government School 01", fmt:"A8"});
  add({name:"SCHOOL_N", table:"derived", gu:"શાળા ક્રમ (સંખ્યા)", en:"School number (for multilevel models)", type:"numeric", codes:"1…k in sorted school-code order"});
  add({name:"DISTRICT", table:"derived from SCHOOL_ID", no:"(5)", gu:"જિલ્લો", en:"District", type:"single", codes:DISTRICTS.map(d => `${d.n} = ${d.en} (${d.id})`).join("; "), fmt:"F1.0"});
  add({name:"SCHOOL_TYPE", table:"derived from SCHOOL_ID", no:"(2)", gu:"શાળાનો પ્રકાર", en:"School type", type:"single", codes:STYPES.map(t => `${t.n} = ${t.en}`).join("; "), fmt:"F1.0"});
  add({name:"STANDARD", table:"Student_Master", gu:"ધોરણ", en:"Standard", type:"constant", codes:"8"});
  add({name:"GENDER", table:"Student_Master", no:"(6)", gu:"જાતિ", en:"Gender", type:"single", codes:"1 = Boy (કુમાર); 2 = Girl (કન્યા)", missing:`${NORESP} = No response`});
  add({name:"COLLECTION_DATE", table:"Student_Master", gu:"માહિતી એકત્રીકરણ તારીખ", en:"Date of data collection", type:"date", fmt:"A10"});
  add({name:"Q_STATUS", table:"Student_Master", gu:"પ્રશ્નાવલિ સ્થિતિ", en:"Questionnaire status", type:"single", codes:"1 = Incomplete; 2 = Complete; 3 = Verified & locked", level:"ordinal", fmt:"F1.0"});
  for (const s of SECTIONS) for (const q of (s.qs || [])) {
    const table = s.obj === "હેતુ 3" ? "Objective3_Responses" : "Objective2_Responses";
    if (q.k === "table") { q.items.forEach(it => add({name:it.v, table, sec:s.id, no:it.no, gu:it.gu, en:it.en, type:"single (3-point)", codes:"3 = Regularly (નિયમિત રીતે); 2 = Sometimes (ક્યારેક); 1 = Never (ક્યારેય નહીં)",
      missing:`${NORESP} = No response`, level:"ordinal", rc:"raw = clean", construct:it.c, leg:it.leg})); continue; }
    if (q.k === "rank") { q.raw.forEach((v, i) => add({name:v, table, sec:s.id, no:q.no, gu:`${q.q} → ${q.items[i]}`, en:`C3 rank given to ${q.items_en[i]} (1 = most liked)`, type:"rank 1–4", codes:"1–4",
      missing:`${INVALID} = Invalid rank set; ${NORESP} = No response`, level:"ordinal", rc:"raw = clean if valid", leg:`C3_${i + 1}`})); continue; }
    const ql = (q.q || "") + (q.sub ? " " + q.sub : "");
    if (q.clean === "multi") q.raw.forEach((v, i) => add({name:v, table, sec:s.id, no:q.no, gu:`${ql} → ${q.opts[i]}`, en:`${q.en}: ${q.opts_en[i]}`, type:"multiple (binary)", codes:"1 = Selected; 0 = Not selected",
      missing:`${NORESP} = Question not answered`, rc:"raw = clean", leg:`${q.leg}_${i + 1}`, group:q.v}));
    else {
      add({name:q.v, table, sec:s.id, no:q.no, gu:ql, en:q.en + " (one option)", type:"single", codes:q.opts_en.map((o, i) => `${i + 1} = ${o} (${q.opts[i]})`).join("; "), missing:M, rc:"clean (from raw marks)", leg:q.leg, opts:q.opts, opts_en:q.opts_en});
      q.raw.forEach((v, i) => add({name:v, table, sec:s.id, no:q.no, gu:`${ql} → ${q.opts[i]} (✓ જેમનું તેમ)`, en:`${q.en}: marked ${q.opts_en[i]} (raw)`, type:"raw mark (binary)", codes:"1 = Marked; 0 = Not marked",
        missing:"blank = question not answered", rc:"raw", leg:`${q.leg}_${i + 1}`, group:q.v}));
    }
    if (q.oth) add({name:q.oth, table, sec:s.id, no:q.no, gu:`${ql} → અન્ય (લખાણ)`, en:`${q.en}: other (text)`, type:"text", rc:"raw", fmt:"A500", leg:q.leg + "_OTH"});
  }
  CONSTRUCTS.forEach(c => add({name:c.id, table:"derived", gu:c.gu + " — સરેરાશ (1–3)", en:c.en + " — mean, ≥80% items answered", type:"derived score", codes:"1.00–3.00 (higher = more frequent)", level:"scale", rc:"clean (derived)", construct:c.id, fmt:"F4.2"}));
  return R;
}

  /* ---- automatic table finding: deskew, find ruled lines, take the right-most answer columns and the last n rows ---- */
  function autoFind(img, rows, cols) {
    const sc = Math.min(1, 1600 / Math.max(img.width, img.height)), W = Math.round(img.width * sc), H = Math.round(img.height * sc), d = img.data, N = W * H;
    const g = new Float32Array(N), bl = new Uint8Array(N);

      const r = d[o], gg = d[o + 1], b = d[o + 2]; g[y * W + x] = (r + gg + b) / 3; bl[y * W + x] = b - r > 22 && b - gg > 5 ? 1 : 0; }

    let best = 0, bs = -1;                                   // deskew: angle that makes horizontal lines sharpest
    for (let a = -7; a <= 7.01; a += .25) { const t = a * Math.PI / 180, cs = Math.cos(t), sn = Math.sin(t), h = new Float32Array(H * 2 + W);
      for (const i of pts) { const x = i % W, y = (i - x) / W; h[Math.round(y * cs - x * sn + W)]++; }
      let s = 0; for (const v of h) s += v * v; if (s > bs) { bs = s; best = t; } }
    const cs = Math.cos(best), sn = Math.sin(best), M = new Uint8Array(N);
    for (const i of pts) { const x = i % W, y = (i - x) / W, X = Math.round(x * cs + y * sn), Y = Math.round(y * cs - x * sn); if (X >= 0 && X < W && Y >= 0 && Y < H) M[Y * W + X] = 1; }
    const runs = (len, other, at) => { const out = []; for (let k = 0; k < len; k++) { const on = [];
        for (let j = 0; j < other; j++) if (at(k, j) || (k > 0 && at(k - 1, j)) || (k < len - 1 && at(k + 1, j))) on.push(j);
        out.push(on.length ? {k, L: on.length, a: on[Math.floor(on.length * .03)], b: on[Math.floor(on.length * .97)]} : {k, L: 0, a: 0, b: 0}); } return out; };
    const merge = (arr, minL) => { const o = []; for (const r of arr) { if (r.L < minL) continue; const p = o[o.length - 1];
        if (p && r.k - p.k2 <= 3) { p.k2 = r.k; if (r.L > p.L) { p.L = r.L; p.a = r.a; p.b = r.b; } } else o.push({k: r.k, k2: r.k, L: r.L, a: r.a, b: r.b}); }

    const vt = merge(runs(W, H, (x, y) => M[y * W + x]), H * .12).filter(v => v.L > (v.b - v.a) * .6);

    if (vt.length < cols + 1) return null;
    // right-most group of cols+1 vertical lines that overlap in height and are not too far apart
    let pick = null;
    for (let e = vt.length - 1; e >= cols && !pick; e--) { const grp = vt.slice(e - cols, e + 1);
      const y0 = Math.max(...grp.map(v => v.a)), y1 = Math.min(...grp.map(v => v.b)); const gaps = grp.slice(1).map((v, i) => v.p - grp[i].p);
      const sim = grp.every(v => Math.abs(v.a - grp[0].a) < H * .06 && Math.abs(v.b - grp[0].b) < H * .06);
      if (sim && y1 - y0 > H * .1 && Math.max(...gaps) < W * .25 && Math.min(...gaps) > W * .02 && Math.max(...gaps) < Math.min(...gaps) * 3) pick = {grp, y0, y1}; }
    if (!pick) return null;
    const xL = pick.grp[0].p, xR = pick.grp[cols].p, x0 = Math.round(xL + 3), x1 = Math.round(xR - 3), ext = (pick.y1 - pick.y0) * .06 + 6;
    const hs = [];
    for (let y = Math.max(1, Math.round(pick.y0 - ext)); y < Math.min(H - 1, pick.y1 + ext); y++) { let c = 0;
      for (let x = x0; x < x1; x++) if (M[y * W + x] || M[(y - 1) * W + x] || M[(y + 1) * W + x] || (y > 1 && M[(y - 2) * W + x]) || (y < H - 2 && M[(y + 2) * W + x])) c++;
      if (c > (x1 - x0) * .6) { if (hs.length && y - hs[hs.length - 1][1] <= 3) hs[hs.length - 1][1] = y; else hs.push([y, y]); } }

    if (hs.length < rows + 2) return null;          // header line + all row lines must be seen, else let the operator place the corners
    const ysAll = hs.map(([a, b]) => (a + b) / 2);
    const ys = ysAll.slice(-(rows + 1)), yT = ys[0], yB = ys[rows];
    const back = (X, Y) => [(X * cs - Y * sn) / sc, (Y * cs + X * sn) / sc];   // inverse rotation, back to full size
    return [back(xL, yT), back(xR, yT), back(xR, yB), back(xL, yB)];
  }

  /* ---- PDF (scanned bundle) ---- */

      el("div", {class: "pr-cfg"}, "કોષ્ટક:", gSel, "પ્રથમ પ્ર.નં.", start, "હરોળ", cnt,
        el("span", {style: "margin-left:auto"}, "ઝૂમ"), el("button", {type: "button", onclick: () => zoom(-100)}, "−"), el("button", {type: "button", onclick: () => zoom(100)}, "+")), pNav, hint, body, el("div", {class: "pr-bot"}, bReset, bRead, bApply));

      if (!S.img) { hint.textContent = "📂 ફોટો / PDF દબાવી ભરેલા પાનાનો ફોટો કે સ્કૅન કરેલી PDF (આખું બંડલ) પસંદ કરો. પાનું સીધું, પૂરા પ્રકાશમાં."; return; }

    }
    function rowsN() { const n = Math.max(1, Math.min(+cnt.value || 1, G().rows - (+start.value || 1) + 1)); cnt.value = n; return n; }

        tr.append(el("td", {class: "why"}, i in S.man ? "જાતે" : r.why)); tb.append(tr); });

      MEM.doc = null; pNav.style.display = "none"; const u = URL.createObjectURL(f), im = new Image();

        c.width = Math.round(im.naturalWidth * m); c.height = Math.round(im.naturalHeight * m); const x = c.getContext("2d"); x.drawImage(im, 0, 0, c.width, c.height);

      im.onerror = () => { URL.revokeObjectURL(u); hint.textContent = "આ ફોટો ખૂલ્યો નહીં (HEIC/બીજું ફોર્મેટ?). કેમેરાથી JPG ફોટો પાડો અથવા સ્ક્રીનશૉટ લઈ તે પસંદ કરો."; };

  }
