<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#18202b; --muted:#59667a; --line:#d6dde7; --soft:#e5edf7;

}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:90px}

.bar h1{font-size:1.05rem;line-height:1.3}

.pill.bad{background:#fde8e6;color:var(--bad)} .pill.ok{background:#dff3e6;color:var(--ok)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;min-height:38px;display:inline-flex;align-items:center}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{flex-wrap:wrap;overflow:visible}
nav.tabs a.more,nav.tabs span.more{display:none}
nav.tabs.open a.more,nav.tabs.open span.more{display:inline-flex}
nav.tabs a.main{flex:1 1 0;justify-content:center;min-width:0;padding:6px 6px;font-size:.84rem;white-space:nowrap}
nav.tabs a.main.cur{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs a.mbtn{flex:none;padding:6px 10px}
nav.tabs .brk{flex-basis:100%;height:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn:disabled{opacity:.55}
input[type=text],input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px} .lbl{font-size:.8rem;color:var(--muted);font-weight:600}

.muted{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opts.m2{grid-template-columns:repeat(2,1fr)} .opts.m5{grid-template-columns:repeat(5,1fr)} .opts.m7{grid-template-columns:repeat(7,1fr)} .opts.m3{grid-template-columns:repeat(3,1fr)}
.sub{display:grid;grid-template-columns:86px 1fr;gap:6px;align-items:center;margin:4px 0} .sub>span{font-size:.78rem;color:var(--muted);font-weight:600}
.tot{font-weight:700;color:var(--accent)} .idrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.big{font-size:1.4rem;font-weight:800;color:var(--accent);letter-spacing:.5px}
.stats{display:flex;gap:8px;flex-wrap:wrap} .stats span{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:.82rem;font-weight:600}
.axh{position:sticky;top:var(--hdrh,108px);z-index:5;background:var(--soft);border-radius:8px;padding:6px 8px;margin:4px 0 6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:.72rem;font-weight:700;color:var(--accent);line-height:1.15}
.axh b{display:block;font-size:1rem}
.opts.ax5{grid-template-columns:repeat(5,1fr)} .opts.ax5 .opt{min-height:48px} .opts.ax5 .opt b{font-size:1.3rem}

.axpad button.on{background:var(--accent);border-color:var(--accent);color:#fff} .axpad button.on span{color:#dce8f5}
.axnav{display:flex;gap:6px} .axnav .btn{min-height:40px;padding:4px 10px}
body.ax main{padding-bottom:190px}

<body>
<header class="top"><div class="wrap">
  <div class="bar"><h1>Chauhan Research — સિદ્ધિ કસોટી<small>હેતુ 4 · 23 પ્રશ્ન · 40 ગુણ · હેતુ 5 સૂચકાંક</small></h1><span id="net" class="pill">…</span></div>
  <nav class="tabs" id="tabs" hidden></nav>
</div></header>
<main class="wrap" id="main"><p class="msg">લોડ થાય છે…</p></main>
<div class="savebar" id="savebar" hidden><div class="wrap" id="axpadWrap" style="display:block" hidden></div><div class="wrap"><span class="prog" id="prog"></span><span class="row"><button class="btn" id="clearBtn" type="button">નવું</button><button class="btn primary" id="saveBtn" type="button">સેવ કરો</button></span></div></div>
<script>
"use strict";
const KIND = "AC";            // "AX" = Objective 6 anxiety scale, "AC" = Objective 4 achievement test
const FB_VER = "10.12.2";
const CODE_RE = /^(VT|A|B|N)(GIA|G|P)S(\d{2})$/;
const ID_RE = /^((VT|A|B|N)(GIA|G|P)S\d{2})-(\d{3,4})$/;
const DIST = {VT:{id:"D01", n:1, gu:"વાવ-થરાદ"}, A:{id:"D02", n:2, gu:"અમદાવાદ"}, B:{id:"D03", n:3, gu:"ભાવનગર"}, N:{id:"D04", n:4, gu:"નવસારી"}};
const STYPE = {G:{n:1, gu:"સરકારી"}, GIA:{n:2, gu:"અનુદાનિત"}, P:{n:3, gu:"સ્વનિર્ભર (ખાનગી)"}};
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (k === "class") el.className = v; else if (k === "hidden") el.hidden = true; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const nowIso = () => new Date().toISOString();
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const steps = (max, st) => Array.from({length:Math.round(max / st) + 1}, (_, i) => i * st);
const fmt = x => x == null ? "" : (Math.round(x * 100) / 100).toString();
const half = x => String(x).replace(".5", "½").replace(/^0½$/, "½");

/* ======================= instrument definitions ======================= */
// ---- Objective 6: maths anxiety scale. Researcher's codes: 5 = સંપૂર્ણ સહમત ... 1 = સંપૂર્ણ અસહમત; 99 = no response; 98 = invalid (more than one tick)
const SCALE5 = [[5, "સંપૂર્ણ સહમત"], [4, "સહમત"], [3, "તટસ્થ"], [2, "અસહમત"], [1, "સંપૂર્ણ અસહમત"]];
const AX_ITEMS = [
  "ગણિતનો તાસ શરૂ થાય તે પહેલાં મને ચિંતા થાય છે.", "ગણિતનું નવું પ્રકરણ સમજવામાં મને ચિંતા થાય છે.", "શિક્ષક ગણિતનું ગૃહકાર્ય તપાસે ત્યારે હું આત્મવિશ્વાસ અનુભવતો નથી.",
  "શિક્ષક જ્યારે ગણિતનું ગૃહકાર્ય તપાસે ત્યારે મને ગભરામણ થાય છે.", "વર્ગમાં શિક્ષક મને મૌખિક રીતે ગણિતનો પ્રશ્ન પૂછે ત્યારે મને ગભરામણ થાય છે.", "શિક્ષક ગણિતનો નવો મુદ્દો સમજાવે ત્યારે મને હળવાશ અનુભવાય છે.",
  "ગણિતના તાસમાં મારી મૂંઝવણ રજૂ કરવામાં મને સંકોચ થાય છે.", "હું ગણિતના પ્રશ્નો ઉકેલવાનું શરૂ કરવાથી ડરું છું.", "ગણિત શીખવામાં મને આનંદ આવે છે.",
  "ગણિતના મુશ્કેલ પ્રશ્નો જોતા જ મને ગભરામણ થાય છે.", "ગણિત વિષય વિશે વિચારીને જ મારા મનમાં તણાવ ઊભો થાય છે.", "ગણિતના અધૂરા દાખલા ઉકેલવાનો પ્રયત્ન કરવામાં મને આનંદ આવે છે.",
  "ગણિત વિશે વિચારતાં મને ચિંતા થાય છે.", "ચિંતાના કારણે ગણિતના પ્રશ્નો સમજવામાં મને મુશ્કેલી પડે છે.", "ગણિતની પરીક્ષા નજીક આવે ત્યારે મારી ચિંતા વધતી જાય છે.",
  "મને ગણિતની પરીક્ષામાં દાખલા ખોટા પડવાનો ડર લાગે છે.", "ગણિતની પરીક્ષાની આગલી રાત્રે ચિંતાના કારણે મને ઊંઘ આવવામાં તકલીફ પડે છે.", "હું ગણિતની પરીક્ષા દરમિયાન સામાન્ય રીતે શાંત રહું છું.",
  "ગણિતની પરીક્ષા વખતે મારા હૃદયના ધબકારા વધી જાય છે અથવા હાથ ધ્રૂજે છે.", "ગણિતની પરીક્ષાનું પ્રશ્નપત્ર હાથમાં આવતાં જ મને ચિંતા થાય છે.", "પરીક્ષાનું પરિણામ આવ્યા પછી પણ હું સ્વસ્થ રહી શકું છું."];
const AX_POS = [6, 9, 12, 18, 21];      // reverse-scored so that a higher score always = more anxiety
const NORESP = 99, INVALID = 98;

// ---- Objective 4: achievement test, 23 questions, 40 marks. Q20, Q21, Q23 entered as process sub-marks (F = formulate, S = solve/justify, I = interpret).
const AC_Q = [];
for (let q = 1; q <= 12; q++) AC_Q.push({q, max:1, opts:[0, 1], label:"MCQ"});
for (let q = 13; q <= 19; q++) AC_Q.push({q, max:2, opts:steps(2, .5)});
// one total mark per question, in steps of ½ (researcher's decision: no separate F/S/I sub-marks)
AC_Q.push({q:20, max:4, opts:steps(4, .5), label:"બેંક ખાતું"});
AC_Q.push({q:21, max:4, opts:steps(4, .5), label:"ખુરશી"});
AC_Q.push({q:22, max:3, opts:steps(3, .5), label:"વિકર્ણનું વિધાન"});
AC_Q.push({q:23, max:3, opts:steps(3, .5), label:"સ્તંભ આલેખ"});
const AC_TOTAL = AC_Q.reduce((a, x) => a + x.max, 0);   // 40
// Mathematisation components of the test (Objective 5 item map; C1 merged with C4)
const AC_COMP = {C2:[11, 18, 23], C3:[1, 9, 13, 16, 17, 22], C4:[2, 6, 12, 14, 15, 20, 21], C7:[3, 4, 5, 7, 8, 10, 19]};
const qmax = q => AC_Q.find(x => x.q === q).max;
const AC_VARS = AC_Q.flatMap(x => x.subs ? [...x.subs.map(s => `Q${x.q}_${s[0]}`), `Q${x.q}`] : [`Q${x.q}`]);

const T = KIND === "AX"
  ? {col:"ax_students", page:"anxiety.html", short:"ચિંતા માપદંડ", n:AX_ITEMS.length}
  : {col:"ac_students", page:"test.html", short:"સિદ્ધિ કસોટી", n:AC_Q.length};
const S = {fb:null, uid:null, role:null, name:"", recs:new Map(), sub:null, cur:null, i:0, flash:null, owner:null, link:null};

/* ======================= scoring ======================= */
const isAns = v => v >= 1 && v <= 5;
function axSummary(r){
  const sc = AX_ITEMS.map((_, i) => { const v = r["AX" + (i + 1)]; return isAns(v) ? (AX_POS.includes(i + 1) ? 6 - v : v) : null; });
  const got = sc.filter(x => x != null), n = got.length;
  return {sc, n, mean:n >= Math.ceil(.8 * AX_ITEMS.length) ? got.reduce((a, b) => a + b, 0) / n : null, total:n === AX_ITEMS.length ? got.reduce((a, b) => a + b, 0) : null};
}
function acQ(r, x){   // marks for one question (sum of sub-marks if any); null = not entered
  if (x.subs) { const v = x.subs.map(s => r[`Q${x.q}_${s[0]}`]); return v.every(y => y == null) ? null : v.reduce((a, b) => a + (b || 0), 0); }
  const v = r["Q" + x.q]; return v == null ? null : v;
}
function acSummary(r){
  if (r.ABSENT) return {absent:true, n:0, total:null, pct:null, comp:{}};
  const m = {}; AC_Q.forEach(x => m[x.q] = acQ(r, x));
  const n = AC_Q.filter(x => m[x.q] != null).length;
  const total = n === AC_Q.length ? AC_Q.reduce((a, x) => a + m[x.q], 0) : null;
  const comp = {}; for (const [c, qs] of Object.entries(AC_COMP)) { const mx = qs.reduce((a, q) => a + qmax(q), 0); comp[c] = total == null ? null : qs.reduce((a, q) => a + m[q], 0) / mx * 100; }
  return {n, m, total, pct:total == null ? null : total / AC_TOTAL * 100, comp};
}

/* ======================= boot / auth ======================= */
function setNet(){ const n = $("#net"); const on = navigator.onLine; n.textContent = on ? "✓ ક્લાઉડ જોડાયેલ" : "ઓફલાઇન — ફોનમાં સચવાશે"; n.className = "pill " + (on ? "ok" : "bad"); }
addEventListener("online", setNet); addEventListener("offline", setNet);
function fatal(t, link){ const m = $("#main"); m.textContent = ""; $("#tabs").hidden = true; $("#savebar").hidden = true;
  m.append(h("div", {class:"card"}, h("p", {class:"msg warn"}, t), link ? h("a", {class:"btn primary", href:"./index.html", style:"display:inline-flex;align-items:center;text-decoration:none"}, "મુખ્ય એપ ખોલો →") : null)); }
async function boot(){
  setNet();
  const c = window.FIREBASE_CONFIG || {};
  if (["apiKey", "authDomain", "projectId", "appId"].some(k => !c[k] || /PASTE|YOUR_/i.test(String(c[k])))) return fatal("ક્લાઉડ ગોઠવાયું નથી (firebase-config.js).");
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  let A, U, F;
  try { [A, U, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]); }
  catch (e) { return fatal("Firebase લોડ ન થયું — ઇન્ટરનેટ ચાલુ કરી ફરી ખોલો."); }
  const app = A.initializeApp(c); let db;
  try { db = F.initializeFirestore(app, {localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); } catch (e) { db = F.getFirestore(app); }
  S.fb = {F, U, db, auth:U.getAuth(app)};
  let meUnsub = null;
  U.onAuthStateChanged(S.fb.auth, u => {
    if (meUnsub) { meUnsub(); meUnsub = null; } stopSub(); S.role = null;

function idx(rec, varsList){   // (mean − 1) / 2 × 100, only when ≥ 80% of the items are answered

  if (vals.length < Math.ceil(.8 * varsList.length)) return null;
  return (vals.reduce((a, b) => a + b, 0) / vals.length - 1) / 2 * 100;
}
const blockVars = b => Object.values(MAP[b].comp).flat().sort((a, c) => a - c).map(MAP[b].vars);

    const fsi = [full("Q20", 4), full("Q21", 4), full("Q22", 3), full("Q23", 3)];
    const mas = a ? axSummary(a).mean : null; const lv = level(MI);
    const d = {TL, EV, AC, MI, lv, pat, tlc, evc, acc, fsi, qm:s ? s.m : null, valid:MI != null};
    D.push(d);
    rows.push([id, meta.SCHOOL_ID, sc[1] ? DIST[sc[1]].n : "", sc[2] ? STYPE[sc[2]].n : "", o ? o.GENDER : "", o ? 1 : 0, t ? 1 : 0, a ? 1 : 0, d.valid ? 1 : 0,
      ...[A_MI, B2_MI, EV, TL, EV, AC, MI].map(x => x == null ? "" : x.toFixed(2)), lv || "", lv ? LEVELS[lv] : "", OPP == null ? "" : OPP.toFixed(2), pat,
      ...[...tlc, ...evc, ...acc].map(x => x == null ? "" : x.toFixed(2)), ...fsi.map(x => x == null ? "" : x), mas == null ? "" : mas.toFixed(3)]);

  const stat = xs => { const v = xs.filter(x => x != null); if (!v.length) return ["", "", "", "", "", ""]; const mean = v.reduce((a, b) => a + b, 0) / v.length;
    const sd = v.length > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (v.length - 1)) : 0; const so = v.slice().sort((a, b) => a - b);

    return {ovl, S, setImage: im => { S.img = im; const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; c.getContext("2d").putImageData(im, 0, 0); S.url = c.toDataURL(); S.pts = []; S.res = null; draw(); }, setPts: p => { S.pts = p; draw(); }, read: () => bRead.click(), apply: () => bApply.click(), sel: (gi, st, n) => { gSel.value = gi; start.value = st; cnt.value = n; } };
  }
  window.PhotoRead = {open, analyse, autoFind};
})();
