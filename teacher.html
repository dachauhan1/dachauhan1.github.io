:root{

*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:84px}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--accent);white-space:nowrap}

nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;min-height:38px;display:inline-flex;align-items:center}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{flex-wrap:wrap;overflow:visible}
nav.tabs a.more,nav.tabs span.more{display:none}
nav.tabs.open a.more,nav.tabs.open span.more{display:inline-flex}
nav.tabs a.main{flex:1 1 0;justify-content:center;min-width:0;padding:6px 6px;font-size:.84rem;white-space:nowrap}
nav.tabs a.main.cur{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs a.mbtn{flex:none;padding:6px 10px}
nav.tabs .brk{flex-basis:100%;height:0}
.paperform .qsec{display:block!important}
.paperform .qsec .pager{display:none}
.paperform .qsec:last-of-type .pager{display:flex}
body.mg header.top h1 small,body.mg .qv,body.mg .qhint:not(#expHint),body.mg .intro,body.mg .cover,body.mg .instr,body.mg .part,body.mg #secnavCard,body.mg #qcCard,body.mg .qsec.infoonly,body.mg .paperform .qsec .pager{display:none!important}
body.mg .qsec{padding-top:8px;padding-bottom:8px}
body.mg .q{margin:6px 0}
.qk{display:flex;gap:6px;align-items:center;margin:4px 0 6px}
.qk input{max-width:220px;font-size:1.15rem;letter-spacing:3px;font-weight:700}
.qk span{font-size:.8rem;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn.small{min-height:36px;padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
textarea{min-height:70px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:14px 0;padding:14px}
.card>h2{color:var(--accent);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px} .field>label,.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.msg{margin:10px 0;padding:10px 14px;border-radius:10px;border-left:5px solid var(--accent);background:var(--surface);font-weight:500}
.msg.ok{border-color:var(--ok)} .msg.warn{border-color:var(--warn);background:#fff8ec} .msg.bad{border-color:var(--bad);background:#fdf1ef}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.82rem;color:var(--muted)}
.progress{height:16px;border-radius:999px;background:var(--soft);overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--accent)}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--soft);position:sticky;top:0}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.badge{display:inline-block;border-radius:6px;padding:0 6px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-ok{background:#dff3e6;color:var(--ok)} .b-warn{background:#fff1dc;color:var(--warn)} .b-bad{background:#fde8e6;color:var(--bad)} .b-mut{background:#eceff0;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
.filters .field{min-width:150px;flex:1}

.secnav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:thin}
.secnav button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:.8rem;cursor:pointer;white-space:nowrap;min-height:36px}
.secnav button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.secnav button i{font-style:normal;font-size:.72rem;color:var(--muted);margin-left:4px}
.secnav button.full i{color:var(--ok)}
.qsec{display:none} .qsec.on{display:block}
.qsec .part{font-weight:700;color:var(--muted);font-size:.9rem}
.qsec .stitle{font-size:1.1rem;font-weight:700;color:var(--accent);margin:2px 0 6px}
.intro{color:var(--muted);font-size:.9rem;margin:2px 0 8px}
.q{padding:12px 0;border-bottom:1px dashed var(--line)} .q:last-child{border-bottom:0}

.qhint{font-size:.75rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);cursor:pointer;user-select:none}
.chip input[type=checkbox]+span::before{content:"";width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;flex:none}
.chip input[type=radio]+span::before{content:"";width:16px;height:16px;border:2px solid var(--muted);border-radius:50%;flex:none}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.chip input:checked+span::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 3px var(--accent)}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.othbox{display:flex;gap:6px;align-items:center;flex:1 1 240px}
.othbox span{font-size:.85rem;color:var(--muted);white-space:nowrap}
.rt{width:100%;border-collapse:collapse;margin-top:6px}
.rt th{font-size:.78rem;color:var(--muted);text-align:center;padding:4px;border-bottom:1px solid var(--line)}
.rt th:nth-child(2){text-align:left}
.rt td{border-bottom:1px solid var(--line);padding:6px 4px;vertical-align:middle}
.rt td.n{width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
.rt td.c{text-align:center;width:84px}
.rt label{position:relative;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;cursor:pointer}
.rt label:hover{background:var(--soft)}
.rt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.rt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none}
.rt .mn{display:none;color:var(--muted);margin-right:6px}
.rt input:checked+.dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.rt input:focus-visible+.dot{outline:3px solid var(--accent);outline-offset:2px}
.rt .ml{display:none}
@media (max-width:620px){
  .rt thead{display:none} .rt tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);padding:8px 0;gap:4px}
  .rt td{border:0;padding:0} .rt td.it{grid-column:1 / -1} .rt td.n{display:none} .rt .mn{display:inline!important}
  .rt td.c{width:auto} .rt .ml{display:block;font-size:.7rem;color:var(--muted);margin-left:6px}
  .rt label{justify-content:flex-start;padding-left:6px;border:1px solid var(--line)}
}

.q.skipped{display:none}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}

.cover{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.82rem;color:var(--muted);margin:6px 0 10px}
.instr li{margin:4px 0}
.chart .row{display:grid;grid-template-columns:minmax(120px,40%) 1fr 70px;gap:8px;align-items:center;font-size:.85rem;margin:3px 0}
.chart .bar{height:18px;background:var(--accent);border-radius:4px;min-width:2px}
.chart .num{font-variant-numeric:tabular-nums;text-align:right}
.center{max-width:440px;margin:40px auto}
.note{font-size:.85rem;color:var(--muted)}
code{font-size:.85em;background:var(--soft);padding:0 4px;border-radius:4px;word-break:break-all}
[hidden]{display:none!important}
.ovl{position:fixed;inset:0;z-index:100;background:rgba(15,25,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{max-width:460px;width:100%;margin:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

function qualityOf(rec){

  if (rec.TRAIN_Q1_RECEIVED === 2 && trainVars.some(v => !isEmpty(rec[v.name]) && rec[v.name] !== 0)) warn.push("વિરોધાભાસ: તાલીમ 'ના' છે પણ તાલીમના જવાબ ભરેલા છે");

  const nm = (rec.TEACHER_NAME || "").trim().toLowerCase().replace(/\s+/g, " ");
  if (nm) for (const [id, o] of S.teachers) if (id !== rec.TID && o.SID === rec.SID && (o.TEACHER_NAME || "").trim().toLowerCase().replace(/\s+/g, " ") === nm) warn.push(`સંભવિત ડુપ્લિકેટ: ${id} માં એ જ નામ અને શાળા`);
  return {err, warn, comp:c};
}

async function retry1(fn){ try { return await fn(); } catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random() * 900)); return fn(); } throw e; } }
function makeShim(db){
  const st = d => { const o = {}; for (const k in d) { const v = d[k]; o[k] = v && v.__st ? new Date().toISOString() : v; } return o; };
  return {
    doc:(_, c, id) => db.doc(c + "/" + id), collection:(_, c) => db.collection(c),
    getDoc:async r => { const x = await r.get(); return {id:x.id, exists:() => x.exists, data:() => x.data()}; },
    setDoc:(r, d) => retry1(() => r.set(st(d))), deleteDoc:r => retry1(() => r.delete()), addDoc:(c, d) => retry1(() => c.add(st(d))),
    serverTimestamp:() => ({__st:true}),
    query:(r, ...cons) => cons.reduce((q, f) => f(q), r), orderBy:(f, dir) => q => q.orderBy(f, dir), limit:n => q => q.limit(n),
    onSnapshot:(q, a, b, c) => { const next = typeof a === "function" ? a : b, err = typeof a === "function" ? b : c;
      return q.onSnapshot(sn => next({docs:sn.docs.map(x => ({id:x.id, data:() => x.data()})), metadata:sn.metadata}), e => err && err(e)); },
    writeBatch:() => { const ops = []; return {set:(r, d) => ops.push([r, d]), commit:async () => { for (const [r, d] of ops) await retry1(() => r.set(st(d))); }}; },
  };
}

function freq(v, recs){

}

  if (v.type === "single" || v.type === "single (rating)") return {N, answered, rows:v.opts.map((o, i) => { const f = vals.filter(x => x === codeOf(v, i)).length; return {code:codeOf(v, i), label:o, f, p:pct(f, N), vp:pct(f, answered)}; })};
  if (v.type === "multiple (binary)") { const f = vals.filter(x => x === 1).length; return {N, answered, rows:[{code:1, label:"પસંદ કર્યું (✓)", f, p:pct(f, N), vp:pct(f, answered)}, {code:0, label:"પસંદ નથી", f:answered - f, p:pct(answered - f, N), vp:pct(answered - f, answered)}]}; }
  return null;

  if (!n) return {n:0}; const mean = xs.reduce((a, b) => a + b, 0) / n; const sd = n > 1 ? Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0;
  const med = n % 2 ? xs[(n - 1) / 2] : (xs[n / 2 - 1] + xs[n / 2]) / 2;
  return {n, mean:Math.round(mean * 100) / 100, sd:Math.round(sd * 100) / 100, min:xs[0], med, max:xs[n - 1]};
}

    P(`ધોરણ 8 ના ગણિત પાઠ્યપુસ્તકની વિષયવસ્તુ NCF-SE 2023 ના પાઠ્યપુસ્તક-રચના સિદ્ધાંતો સાથે ${caLevel(bookMean)} (${bookIdx.toFixed(2)}%) સુસંગતતા ધરાવે છે. '${CA_SHORT[ord[0].ci]}' અને '${CA_SHORT[ord[1] ? ord[1].ci : ord[0].ci]}' સિદ્ધાંતો સાથે સુસંગતતા વધુ, જ્યારે '${CA_SHORT[ord[ord.length - 1].ci]}' અને '${CA_SHORT[ord[ord.length - 2] ? ord[ord.length - 2].ci : ord[ord.length - 1].ci]}' સાથે ઓછી છે.${r1.length < 13 ? ` (હાલ ${r1.length}/13 પ્રકરણ પરથી; બધાં પ્રકરણ ભર્યા પછી અંતિમ.)` : ""}`));
  F.unshift(`સમગ્ર પાઠ્યપુસ્તક (${r1.length} પ્રકરણ): ${bookIdx.toFixed(2)}%, ${caLevel(bookMean)} સુસંગતતા; સૌથી વધુ ${CA_SHORT[ord[0].ci]} (M ${fx(ord[0].st.mean)}%), સૌથી ઓછું ${CA_SHORT[ord[ord.length - 1].ci]} (M ${fx(ord[ord.length - 1].st.mean)}%).`);
  // appendix: indicator scores
  const app = [H("પરિશિષ્ટ: હેતુ 1 — સૂચકવાર ગુણ અને પુરાવા (મૂલ્યાંકનકાર 1)", 2)];
  for (const x of r1) app.push(cap(`પ્રકરણ ${x.c}: ${x.name}`), T(["ID", "સૂચક", "ગુણ", "પુરાવો"], CA_IND.map(i => [i.id + (i.dag ? " †" : ""), i.text, x.d.S?.[i.id] ?? "–", x.d.E?.[i.id] || ""]), "ગુણ: 0–3. 'જવાબ' = પાના-આધારિત પુરાવો/નોંધ."));
  return {b, F, r1, app, bookIdx, bookMean, ord};
}

const CA_DEF = {"1.1": ["પ્રકરણની વિષયવસ્તુ ધોરણ 8ની નિર્ધારિત અધ્યયન નિષ્પત્તિઓ (Grade-specific Learning Outcomes) સાથે સુસંગત છે.", "પ્રકરણ-માહિતી પત્રકમાંની દરેક LO માટે સમજૂતી, ઉદાહરણ કે સ્વાધ્યાયમાં મેળ ખાતો અંશ; કઈ LO આવરી લેવાઈ નથી તે પણ નોંધો."], "1.2": ["વિષયવસ્તુ મધ્ય તબક્કા (Middle Stage)ની ક્ષમતાઓ (Stage-level Competencies) સાથે સુસંગત છે.", "મધ્ય તબક્કાની સંબંધિત ક્ષમતાઓ (C) વિષયવસ્તુમાં કેટલી હદે સંબોધાઈ છે; ક્ષમતાનું નામ માત્ર લખાયું હોય તે પુરાવો નથી."], "1.3": ["પ્રવૃત્તિઓ અધ્યયન નિષ્પત્તિઓની પ્રાપ્તિમાં સહાયક છે.", "'પ્રયત્ન કરો', પ્રવૃત્તિઓ અને સ્વાધ્યાય-પ્રશ્નો કઈ LOની પ્રાપ્તિ તરફ દોરે છે; કોઈ LO સાથે ન જોડાયેલી પ્રવૃત્તિઓ પણ નોંધો."], "1.4": ["પ્રવૃત્તિઓ ક્ષમતાઓના વિકાસમાં સહાયક છે.", "પ્રવૃત્તિઓમાં ક્ષમતા માટે જરૂરી ક્રિયા — અન્વેષણ, તર્ક, રજૂઆત કે ઉપયોગ — વિદ્યાર્થીએ જાતે કરવાની છે, કે માત્ર અનુકરણ કરવાનું છે?"], "1.5": ["ગાણિતિક ક્ષેત્રો — સંખ્યા-પદ્ધતિ, બીજગણિત, ભૂમિતિ અને આંકડાશાસ્ત્ર — વચ્ચે આડો અનુબંધ (horizontal connections) દર્શાવવામાં આવ્યો છે.", "પ્રકરણના ખ્યાલને બીજા ગાણિતિક ક્ષેત્ર સાથે જોડતાં વિધાનો, ઉદાહરણો કે પ્રશ્નો (દા.ત. સંખ્યા ↔ બીજગણિત, બીજગણિત ↔ ભૂમિતિ)."], "1.6": ["પ્રકરણમાં રજૂ થયેલા ગાણિતિક ખ્યાલો અગાઉના, વર્તમાન અને અનુગામી ધોરણોના ખ્યાલો સાથે પ્રગતિશીલ ક્રમમાં જોડાયેલા છે (vertical progression).\nપાસાં: (ક) અગાઉના ધોરણ સાથે જોડાણ; (ખ) અનુગામી ધોરણ તરફ જોડાણ", "અગાઉના ધોરણ/પ્રકરણના પૂર્વજ્ઞાનનો ઉલ્લેખ કે પુનરાવર્તન, અને આગળના ખ્યાલ તરફ સંકેત ('તમે શીખી ગયા છો…', 'આગળ આપણે…')."], "1.7": ["ગાણિતિક ખ્યાલોની વાસ્તવિક જીવનમાં ઉપયોગિતા ઉદાહરણો દ્વારા દર્શાવવામાં આવી છે (real-life applicability).", "ખ્યાલનો ઉપયોગ દર્શાવતાં વાસ્તવિક પરિસ્થિતિવાળાં ઉદાહરણો/પ્રશ્નો; માત્ર નામ ઉમેરેલા શાબ્દિક દાખલા નહીં, પરિસ્થિતિમાં ગણિતનો અર્થપૂર્ણ ઉપયોગ."], "1.8": ["ગણિત અને અન્ય વિષયો (વિજ્ઞાન, સામાજિક વિજ્ઞાન, કળા વગેરે) વચ્ચે અનુબંધ દર્શાવવામાં આવ્યો છે. †", "વિજ્ઞાન, સામાજિક વિજ્ઞાન, કળા કે રમત-ગમત સાથે ગણિતનું સ્પષ્ટ જોડાણ દર્શાવતું ઉદાહરણ, પ્રવૃત્તિ કે પ્રશ્ન."], "2.1": ["વિષયવસ્તુમાં સકારાત્મક સામાજિક મૂલ્યો પ્રતિબિંબિત થાય છે.", "ઉદાહરણો/પ્રવૃત્તિઓમાં સહકાર, પ્રમાણિકતા, બચત કે પર્યાવરણ-જાળવણી જેવાં મૂલ્યોનો સ્વાભાવિક સંદર્ભ; માત્ર ઉપદેશાત્મક વાક્ય પૂરતું નથી."], "2.2": ["વિષયવસ્તુમાં માનવીય અને સામાજિક સંવેદનશીલતા પ્રતિબિંબિત થાય છે.", "બીજાની જરૂરિયાત પ્રત્યે સંવેદના દર્શાવતા સંદર્ભો (વહેંચણી, મદદ, વડીલો/દિવ્યાંગો પ્રત્યે આદર)."], "2.3": ["વિષયવસ્તુમાં સામાજિક જવાબદારીને પ્રોત્સાહન આપવામાં આવ્યું છે.", "સમાજ અને પર્યાવરણ પ્રત્યેની જવાબદારી (પાણી-વીજળી બચત, સ્વચ્છતા, જાહેર સંપત્તિ) સાથે જોડાયેલા સંદર્ભો."], "2.4": ["ઉદાહરણો અને પ્રવૃત્તિઓમાં સર્વસમાવેશી દૃષ્ટિકોણ પ્રતિબિંબિત થાય છે.", "ઉદાહરણો/પ્રવૃત્તિઓ દ્વારા સમાનતા અને આદરનો મૂલ્ય-સંદેશ. પાત્રો અને પ્રદેશોનું પ્રતિનિધિત્વ 9.1-9.3માં ગણાય છે; અહીં ફરી ન ગણો."], "2.5": ["ભાષા અને અભિવ્યક્તિ પૂર્વગ્રહમુક્ત છે.", "કોઈ વ્યવસાય, સમુદાય કે આર્થિક વર્ગ માટે ઉતરતું કે અપમાનજનક વર્ણન નથી (શ્રમનું ગૌરવ). લિંગ-તટસ્થ શબ્દ-પસંદગી 9.5માં ગણાય છે."], "3.1": ["વિષયવસ્તુ ખ્યાલાત્મક રીતે સાચી અને ભૂલરહિત છે (સંખ્યા-પદ્ધતિ, બીજગણિત, ભૂમિતિ, આંકડાશાસ્ત્ર).", "વ્યાખ્યાઓ, ગુણધર્મો, સૂત્રો અને વિધાનોમાં ગાણિતિક ભૂલ, ખૂટતી શરત (દા.ત. છેદ શૂન્ય ન હોય) કે ભ્રામક સામાન્યીકરણ નથી; દરેક ભૂલ પાના સાથે નોંધો."], "3.2": ["ગાણિતિક ખ્યાલો તાર્કિક ક્રમમાં — સરળથી જટિલ તરફ — રજૂ કરવામાં આવ્યા છે.", "પૂર્વજરૂરી ખ્યાલ પહેલાં આવે છે, ઉદાહરણો સરળથી જટિલ તરફ જાય છે, અને કોઈ ખ્યાલ સમજાવ્યા વિના વપરાયો નથી."], "3.3": ["વિષયવસ્તુમાં ગાણિતિક તાર્કિકતા અને સમર્થન (justification)ને સ્થાન આપવામાં આવ્યું છે.", "'શા માટે?', 'કારણ આપો', 'ચકાસો' જેવા પ્રશ્નો અને ઉકેલેલાં ઉદાહરણોમાં દરેક પગલાનું કારણ; માત્ર નિયમ આપી દેવો પૂરતું નથી."], "3.4": ["પ્રમાણભૂત ગાણિતિક પરિભાષા અને સંકેતોનો યોગ્ય ઉપયોગ કરવામાં આવ્યો છે.\nપાસાં: (ક) પરિભાષા; (ખ) સંકેતો/નોટેશન", "પ્રમાણભૂત પરિભાષા અને સંકેતોનો ગાણિતિક રીતે સાચો અને એકરૂપ ઉપયોગ. ભાષાકીય સુલભતા 5.2માં ગણાય છે."], "3.5": ["ખ્યાલો, પ્રક્રિયાઓ અને તાર્કિકતા વચ્ચે સંતુલન જાળવવામાં આવ્યું છે.", "ખ્યાલ-સમજૂતી, પ્રક્રિયા-મહાવરો અને તર્ક-આધારિત પ્રશ્નોનું પ્રમાણ (ઘટકોની યાદીની ગણતરી પરથી); કોઈ એક પર અતિભાર છે?"], "3.6": ["ઉકેલાયેલાં ઉદાહરણો અને ઉકેલો ગાણિતિક રીતે ચોક્કસ છે.", "દરેક ઉકેલાયેલું ઉદાહરણ અને આપેલો જવાબ ફરી ગણી ચકાસો; ગણતરી-ભૂલ, છાપ-ભૂલ કે ખૂટતાં પગલાં પાના સાથે નોંધો."], "4.1": ["પ્રવૃત્તિઓ સક્રિય અને શોધ આધારિત (inquiry-based) અધ્યયનને પ્રોત્સાહિત કરે છે.", "વિદ્યાર્થી જાતે પ્રશ્ન ઉઠાવે, તપાસે, પેટર્ન શોધે કે નિષ્કર્ષ તારવે તેવાં કાર્યો; 'વાંચો અને યાદ રાખો' પ્રકારનાં કાર્યો નહીં."], "4.2": ["વિષયવસ્તુ પ્રક્રિયાગત પ્રવાહિતા (procedural fluency)ની સાથે ખ્યાલાત્મક સમજ વિકસાવવામાં સહાયક છે.", "પ્રક્રિયા (algorithm) શીખવતાં પહેલાં કે સાથે તેનો અર્થ/કારણ સમજાવાય છે; મહાવરા-પ્રશ્નો ઉપરાંત સમજ ચકાસતા પ્રશ્નો છે."], "4.3": ["વિષયવસ્તુ ઉચ્ચ કક્ષાની ગાણિતિક વિચારશક્તિ — વિશ્લેષણ, તર્ક અને સામાન્યીકરણ — વિકસાવવામાં સહાયક છે.", "વિશ્લેષણ, તર્ક, સામાન્યીકરણ, બહુ-પગલાંવાળી કે અપરિચિત સમસ્યા માગતા પ્રશ્નો; કુલ પ્રશ્નોમાં તેમનું પ્રમાણ."], "4.4": ["વિષયવસ્તુ અન્વેષણ અને અનુમાન (conjecture) માટે તકો પ્રદાન કરે છે.\nપાસાં: (ક) અન્વેષણ; (ખ) અનુમાન (conjecture)", "'પેટર્ન શોધો', 'અનુમાન કરો અને ચકાસો', 'શું હંમેશાં સાચું છે?' જેવી સૂચનાઓ."], "4.5": ["અનુભવ આધારિત ગાણિતિક અધ્યયનને પ્રોત્સાહન આપવામાં આવ્યું છે.", "હાથ વડે કરવાની પ્રવૃત્તિ, માપન, મૂર્ત સાધન કે અનુભવ પરથી ખ્યાલ સુધી લઈ જતી પ્રક્રિયા."], "4.6": ["સહભાગી અને સ્વતંત્ર અધ્યયન માટે તકો ઉપલબ્ધ છે.\nપાસાં: (ક) સહભાગી અધ્યયન; (ખ) સ્વતંત્ર અધ્યયન", "'ચર્ચા કરો', 'મિત્ર સાથે', જોડી/જૂથ-કાર્ય જેવી સૂચનાઓ, તેમ જ સ્વ-અધ્યયન અને જાતે ચકાસણીની તકો."], "4.7": ["21મી સદીનાં કૌશલ્યો — ગાણિતિક સમસ્યા-નિરાકરણ અને વિવેચનાત્મક વિચારસરણી — ને પ્રોત્સાહન આપવામાં આવ્યું છે.\nપાસાં: (ક) સમસ્યા-નિરાકરણ; (ખ) વિવેચનાત્મક વિચારસરણી", "ખુલ્લા (open-ended) પ્રશ્નો, 'ભૂલ શોધો'/'દાવો તપાસો' પ્રકારના પ્રશ્નો, એકથી વધુ ઉકેલ-પદ્ધતિઓ."], "5.1": ["વિષયવસ્તુની ભાષા વિદ્યાર્થીઓની વય, ધોરણ અને ભાષાકીય ક્ષમતાને અનુરૂપ છે.", "વાક્યોની લંબાઈ, શબ્દભંડોળ અને રચના ધોરણ 8ના વિદ્યાર્થી માટે સમજાય તેવી છે; અટપટાં વાક્યો પાના સાથે નોંધો."], "5.2": ["ગાણિતિક પરિભાષાનો યોગ્ય ઉપયોગ કરવામાં આવ્યો છે.", "ગાણિતિક પરિભાષાની સુલભતા: ગુજરાતી શબ્દ સાથે અંગ્રેજી સમાનાર્થ, અને એક ખ્યાલ માટે આખા પ્રકરણમાં એક જ શબ્દ. ગાણિતિક ચોકસાઈ 3.4માં ગણાય છે."], "5.3": ["ભાષા સ્પષ્ટ અને સરળ છે.", "વાક્ય-સ્તરની સ્પષ્ટતા: બેવડા અર્થવાળાં કે અનુવાદ જેવાં અટપટાં વાક્યો નથી. ખ્યાલની સમજાવટ 8.2માં ગણાય છે."], "5.4": ["નવા શબ્દો માટે જરૂરી સ્પષ્ટીકરણ આપવામાં આવ્યું છે.", "નવો શબ્દ પ્રથમ વાર આવે ત્યાં વ્યાખ્યા, ઉદાહરણ કે ચિત્ર દ્વારા સમજૂતી; મુખ્ય શબ્દો અલગ દર્શાવેલા છે."], "5.5": ["ગાણિતિક ભાષાકૌશલ્યોના વિકાસને પ્રોત્સાહન આપવામાં આવ્યું છે.", "વિદ્યાર્થીને પોતાના શબ્દોમાં સમજાવવા, વર્ણન કરવા કે ગાણિતિક વિધાન લખવા પ્રેરતા પ્રશ્નો ('સમજાવો', 'તમારા શબ્દોમાં લખો')."], "6.1": ["દૃશ્ય રજૂઆતો, આકૃતિઓ અને ગાણિતિક પ્રતિનિધિત્વ (representations)નો ઉપયોગ કરવામાં આવ્યો છે.", "આકૃતિ, કોષ્ટક, આલેખ, સંખ્યારેખા જેવાં પ્રતિનિધિત્વ ખ્યાલ સમજાવવામાં વપરાય છે, કે માત્ર સુશોભન છે?"], "6.2": ["QR કોડ, લિંક કે simulation જેવાં ડિજિટલ સંસાધનો પાઠ્યવસ્તુ સાથે અર્થપૂર્ણ રીતે સંકલિત છે.", "QR/લિંક ચોક્કસ ખ્યાલ સાથે જોડાયેલ છે અને ઉપયોગની સૂચના છે; QR-પત્રકમાં તપાસેલી સામગ્રીને આધારે જ ગુણ (નિયમ 9)."], "6.3": ["ટેક્નોલોજીનો ઉપયોગ માત્ર અવેજી (substitution) તરીકે નહીં, પરંતુ ગાણિતિક ખ્યાલોના દૃશ્યીકરણ અને અન્વેષણ માટે કરવામાં આવ્યો છે.", "ડિજિટલ સામગ્રી ગતિશીલ દૃશ્યીકરણ, simulation કે અન્વેષણ આપે છે, કે માત્ર પુસ્તકનું લખાણ કે વ્યાખ્યાન દોહરાવે છે (substitution)?"], "6.4": ["અન્વેષણ કે મહાવરા માટે ડિજિટલ સાધનો સૂચવવામાં આવ્યાં છે.", "કૅલ્ક્યુલેટર, spreadsheet કે ગતિશીલ ભૂમિતિ-સૉફ્ટવેર જેવાં સાધનો, અથવા ડિજિટલ મહાવરા માટે સ્પષ્ટ સૂચન."], "6.5": ["ટેક્નોલોજીનો ઉપયોગ ગાણિતિક અધ્યયનના હેતુઓ સાથે સુસંગત છે.", "દરેક ડિજિટલ ઉપયોગ પ્રકરણની LO/ક્ષમતા સાથે જોડાયેલો છે; હેતુ વિનાનો ઉપયોગ નોંધો."], "7.1": ["પરિચિત અને અપરિચિત સંદર્ભો વચ્ચે સંતુલન જાળવવામાં આવ્યું છે.", "રોજિંદા જીવનના પરિચિત સંદર્ભોથી શરૂઆત અને નવા/અપરિચિત સંદર્ભોમાં ઉપયોગ — બંનેની હાજરી. ગાણિતિક ખ્યાલની પરિચિતતા સંદર્ભ નથી (નિયમ 8)."], "7.2": ["સ્થાનિક, સાંસ્કૃતિક અને સામાજિક-આર્થિક રીતે પ્રાસંગિક સંદર્ભોને સ્થાન આપવામાં આવ્યું છે.\nપાસાં: (ક) સ્થાનિક; (ખ) સાંસ્કૃતિક; (ગ) સામાજિક-આર્થિક", "ગુજરાત/ગામ-શહેરના સ્થાનિક સંદર્ભો, તહેવાર-રમત-પરંપરા જેવા સાંસ્કૃતિક સંદર્ભો અને આવક-ખર્ચ, ખેતી, વ્યવસાય જેવા સામાજિક-આર્થિક સંદર્ભોની સંખ્યા."], "7.3": ["સંદર્ભો વિદ્યાર્થીઓની વયને અનુરૂપ છે.", "સંદર્ભો ધોરણ 8ના વિદ્યાર્થીના અનુભવ-વિશ્વમાંથી (શાળા, રમત, ઘર, બજાર) છે; પુખ્ત-કેન્દ્રિત સંદર્ભો (લોન, શેર-બજાર) નોંધો."], "7.4": ["સંદર્ભો ક્ષમતાઓ અને અધ્યયન નિષ્પત્તિઓને સમર્થન આપે છે.", "સંદર્ભ માત્ર શણગાર નથી; ખ્યાલ સમજવા કે લાગુ કરવા માટે તે જરૂરી છે."], "7.5": ["સંદર્ભો સાંસ્કૃતિક કે આર્થિક પૂર્વગ્રહથી મુક્ત છે.\nપાસાં: (ક) સાંસ્કૃતિક પૂર્વગ્રહ; (ખ) આર્થિક પૂર્વગ્રહ", "એક જ સંસ્કૃતિ કે વર્ગના સંદર્ભોનો એકાધિકાર નથી; શહેરી-સંપન્ન જીવનશૈલી ધારી લેતા સંદર્ભો (દા.ત. કાર, વિદેશ-પ્રવાસ) નોંધો."], "8.1": ["ગાણિતિક ખ્યાલોનો પ્રવાહ તાર્કિક અને સુવ્યવસ્થિત છે.", "વિભાગો વચ્ચે સરળ સંક્રમણ અને સ્પષ્ટ રચના (ઉદાહરણ → સમજૂતી → મહાવરો → સારાંશ). ગાણિતિક પૂર્વજરૂરિયાતનો ક્રમ 3.2માં ગણાય છે."], "8.2": ["ગાણિતિક ખ્યાલોની સમજાવટ સ્પષ્ટ છે.", "ખ્યાલની સમજાવટ પગલાવાર, ઉદાહરણથી સમર્થિત અને સમજાવ્યા વિનાના કૂદકા વગરની છે. વાક્ય-સ્તરની ભાષા 5.3માં ગણાય છે."], "8.3": ["જટિલ ખ્યાલોની રજૂઆત માટે આકૃતિ (diagram) કે ફ્લોચાર્ટનો ઉપયોગ કરવામાં આવ્યો છે.", "જટિલ ખ્યાલ કે પ્રક્રિયા માટે આકૃતિ, ફ્લોચાર્ટ, કોષ્ટક કે ચિત્રાત્મક સારાંશ; જ્યાં જરૂર હતી પણ નથી તે નોંધો."], "8.4": ["વાંચનીયતા અને દૃશ્ય સંતુલન જાળવવામાં આવ્યું છે.\nપાસાં: (ક) વાંચનીયતા; (ખ) દૃશ્ય સંતુલન", "અક્ષર-કદ, અંતર અને છાપની સ્પષ્ટતા; લખાણ અને આકૃતિઓનું સંતુલન, ભીડ વિનાનાં પાનાં."], "8.5": ["પૃષ્ઠરચના વિદ્યાર્થી-મૈત્રીપૂર્ણ છે અને ડિઝાઇનમાં સુસંગતતા જાળવવામાં આવી છે.\nપાસાં: (ક) વિદ્યાર્થી-મૈત્રીપૂર્ણ પૃષ્ઠરચના; (ખ) ડિઝાઇન-સુસંગતતા", "શીર્ષકો, બૉક્સ અને ચિહ્નોથી વિદ્યાર્થી-મૈત્રીપૂર્ણ પૃષ્ઠરચના; સમાન તત્ત્વો માટે આખા પ્રકરણમાં સમાન શૈલી/ચિહ્ન."], "9.1": ["ઉદાહરણો અને ભૂમિકાઓ (roles)માં લિંગ સમતુલા જાળવવામાં આવી છે.", "ઉદાહરણો/પ્રશ્નોમાં છોકરા-છોકરી, સ્ત્રી-પુરુષનાં નામ અને ભૂમિકાઓની ગણતરી; પરંપરાગત ભૂમિકા-રૂઢિ (દા.ત. માત્ર પુરુષ વેપારી) નોંધો."], "9.2": ["ઉદાહરણો અને પ્રશ્નોમાં વિવિધ પ્રદેશોનું પ્રતિનિધિત્વ કરવામાં આવ્યું છે.", "ભારતના વિવિધ પ્રદેશો/રાજ્યો અને ગ્રામ્ય-શહેરી વિસ્તારોના સંદર્ભો; કોઈ એક પ્રદેશનો એકાધિકાર નોંધો."], "9.3": ["વિવિધ સામાજિક વાસ્તવિકતાઓને સ્થાન આપવામાં આવ્યું છે.", "વિવિધ વ્યવસાયો, પરિવાર-રચનાઓ, આર્થિક સ્થિતિઓ અને દિવ્યાંગતા સહિત સામાજિક વાસ્તવિકતાઓના સંદર્ભો."], "9.4": ["વિષયવસ્તુ પ્રથમ પેઢીના વિદ્યાર્થીઓ (first-generation learners) માટે સુલભ છે.", "ઘરે મદદ ન મળતી હોય તેવો વિદ્યાર્થી પણ આગળ વધી શકે: પૂર્વજ્ઞાનનું પુનરાવર્તન, પગલાવાર ઉકેલ, સ્વ-ચકાસણી માટે જવાબ; ઇન્ટરનેટ કે ટ્યૂશન ધારી લેવાયાં નથી."], "9.5": ["ભાષા તટસ્થ અને સર્વસમાવેશી છે.", "લિંગ-તટસ્થ અને બધા સમુદાયોને સમાવતી શબ્દ-પસંદગી; રૂઢિગત કે બાકાત રાખતી ભાષા નોંધો."]};
const CA_RULES = ["દરેક ગુણ પાઠ્યપુસ્તકના મુદ્રિત પાના-ક્રમાંક સાથેના પુરાવા પર આધારિત રાખો; પ્રથમ પાના પર ક્રમાંક મુદ્રિત ન હોય તો 'PDF પાનું 1' લખો.", "પુરાવો માત્ર વિશ્લેષિત પ્રકરણ અને તેના QR કોડ પાછળની સામગ્રીમાંથી લો; બીજાં પ્રકરણ, શિક્ષક-આવૃત્તિ કે બહારના સ્રોતને પુરાવો ન ગણો.", "દરેક સૂચકને 0થી 3 વચ્ચે એક પૂર્ણાંક ગુણ આપો; 'લાગુ પડતું નથી' (N/A) વિકલ્પ નથી, જેથી દરેક પ્રકરણનો મહત્તમ ગુણ 153 જ રહે અને પ્રકરણો સરખાવી શકાય.", "ગુણાંકનના કારણમાં પુરાવો શું દર્શાવે છે, શું ખૂટે છે અને તરત ઉપરનું સ્તર કેમ લાગુ પડતું નથી તે લખો; સરહદી સ્થિતિમાં નીચલું સ્તર આપો.", "સ્તર 3 ત્યારે જ આપો જ્યારે સૂચકનાં બધાં પાસાં માટે સ્પષ્ટ અને આખા પ્રકરણમાં સાતત્યપૂર્ણ પુરાવો હોય; વિષયની માત્ર હાજરીને ગુણવત્તા ન ગણો.", "બહુ-પાસાંવાળા સૂચકો (1.6, 3.4, 4.4, 4.6, 4.7, 7.2, 7.5, 8.4, 8.5): દરેક પાસાને અલગ 0-3 ગુણ આપી 'ગુણાંકનનું કારણ' કૉલમમાં લખો. સૂચકનો ગુણ = પાસાં-ગુણોની સરેરાશ, નજીકના પૂર્ણાંક સુધી; સરેરાશ બરાબર અડધા પર (જેમ કે 1.5) હોય તો નીચેનો પૂર્ણાંક. 3 ગુણ ત્યારે જ, જ્યારે દરેક પાસાને 3 મળ્યા હોય. ઉદાહરણ: 3 અને 1 → 2; 3 અને 0 → 1; 3, 3 અને 2 → 2.", "જ્યાં સૂચકનો વિષય — જેમ કે વાસ્તવિક સંદર્ભ કે માનવ-પરિસ્થિતિ — પ્રકરણમાં જ ગેરહાજર હોય અને તટસ્થતા માત્ર તે ગેરહાજરીથી ઊભી થતી હોય, ત્યાં તેને પ્રતીકાત્મક પુરાવો (સ્તર 1) ગણો.", "ગાણિતિક ખ્યાલની પરિચિતતા (conceptual familiarity)ને વાસ્તવિક-જીવન સંદર્ભની પરિચિતતા (contextual familiarity) ન ગણો; સંદર્ભ સિદ્ધાંતના સૂચકો (7.1-7.5)માં તે વધુમાં વધુ સ્તર 1 ગણાય.", "QR કોડની હાજરી પરથી ડિજિટલ સામગ્રીની ગુણવત્તા માની ન લો; સૂચક 6.2, 6.3 અને 6.5માં QR-સામગ્રી ત્યારે જ ગણો જ્યારે તે 'QR કોડ / ડિજિટલ સામગ્રી વિશ્લેષણ પત્રક'માં તપાસીને નોંધાઈ હોય.", "કોઈ ઘટકને સંપૂર્ણ (100%) ગુણ આપતાં પહેલાં દરેક સૂચક માટે તરત નીચેનું સ્તર વધુ યોગ્ય નથી તેની ફરી ચકાસણી કરો, અને પ્રકરણનું ગુણ-વિતરણ કોષ્ટક ભરો (score inflation ટાળવા).", "દરેક સૂચક તેની 'શું જોવું' કાર્યાત્મક વ્યાખ્યા મુજબ ગુણાંકિત કરો; વ્યાખ્યામાં ન આવરાયેલો કિસ્સો આવે તો લીધેલો નિર્ણય 'નિર્ણય-નોંધ'માં લખો અને તે જ નિર્ણય બધાં પ્રકરણોમાં લાગુ કરો."];

function caConsStats(){

  const H = (t, lvl) => `<w:p><w:pPr><w:pStyle w:val="Heading${lvl}"/></w:pPr>${run(t)}</w:p>`;

    const wt = head.map(x => /^(ક્રમ|કોડ|f|n)$/.test(x) ? 0.6 : /^(મધ્યક|ક્રમાંક|%)$/.test(x) ? 1.0 : /^(વિધાન|વિકલ્પ|પ્રશ્ન|જવાબ|વર્ગ|વિભાગ|બાબત|વિગત|સૂચક|પુરાવો|વર્ણનકર્તા)$/.test(x) ? 4 : x === "જિલ્લો" ? 2.4 : 1.3);

async function restore(file){

  const cols = [["teachers", o.teachers], ["teachers_second", o.teachers_second], ["schools", o.schools], ["qual", o.qual]].filter(([, x]) => x && typeof x === "object");
  const n = cols.reduce((a, [, x]) => a + Object.keys(x).length, 0);
  const bad = Object.keys(o.teachers || {}).filter(k => !validTid(k)).concat(Object.keys(o.schools || {}).filter(k => !validSid(k)));
  if (bad.length) return say("અમાન્ય ID: " + bad.slice(0, 10).join(", "), "bad");
