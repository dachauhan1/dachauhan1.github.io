<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --ink:#18202b; --muted:#59667a; --line:#d6dde7; --soft:#e5edf7;

  --font:"Shruti","Nirmala UI","Noto Sans Gujarati","Lohit Gujarati",system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding-bottom:90px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.bar h1{font-size:1.05rem;line-height:1.3}
.bar h1 small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.bad{background:#fde8e6;color:var(--bad)} .pill.ok{background:#dff3e6;color:var(--ok)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 0 8px}
nav.tabs a{flex:none;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600;min-height:38px;display:inline-flex;align-items:center}
nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)} .btn:disabled{opacity:.55}
input[type=text],input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:14px}
.card>h2{color:var(--accent);font-size:1.05rem;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:3px} .lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.msg{margin:10px 0;padding:10px 14px;border-radius:10px;border-left:5px solid var(--accent);background:var(--surface);font-weight:500}
.msg.ok{border-color:var(--ok);background:#effaf3} .msg.warn{border-color:var(--warn);background:#fff8ec} .msg.bad{border-color:var(--bad);background:#fdf1ef}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;min-height:44px;cursor:pointer;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item{border-bottom:1px solid var(--line);padding:10px 0;scroll-margin-top:150px}
.item.cur{background:#f4f8fd;border-radius:10px;padding:10px 6px}
.item .q{font-weight:600;margin-bottom:6px}
.item .q b{color:var(--accent);margin-right:4px}
.item .q .pos{font-size:.72rem;color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:0 5px;margin-left:6px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(5,1fr) .62fr .62fr;gap:4px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:2px}
.opt b{font-size:1.15rem} .opt span{font-size:.62rem;color:var(--muted);text-align:center}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff} .opt.on span{color:#e6eef8}
.opt.miss.on{background:#6b7380;border-color:#6b7380}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.savebar .wrap{display:flex;align-items:center;gap:8px;justify-content:space-between}
.prog{font-weight:600;font-size:.9rem}
table.t{border-collapse:collapse;width:100%;font-size:.88rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--soft)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
.muted{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="bar"><h1>Chauhan Research — ચિંતા માપદંડ<small>હેતુ 6 · ધોરણ 8 ગણિત ચિંતાતુરતા માપદંડ (21 વિધાન)</small></h1><span id="net" class="pill">…</span></div>

</div></header>
<main class="wrap" id="main"><p class="msg">લોડ થાય છે…</p></main>
<div class="savebar" id="savebar" hidden><div class="wrap"><span class="prog" id="prog"></span><span class="row"><button class="btn" id="clearBtn" type="button">નવું</button><button class="btn primary" id="saveBtn" type="button">સેવ કરો</button></span></div></div>
<script>
"use strict";
const FB_VER = "10.12.2";
const CODE_RE = /^(VT|A|B|N)(GIA|G|P)S(\d{2})$/;
const AX_RE = /^(VT|A|B|N)(GIA|G|P)S\d{2}-X\d{3}$/;
const O23_RE = /^(VT|A|B|N)(GIA|G|P)S\d{2}-\d{3,4}$/;
const DIST = {VT:{id:"D01", n:1, gu:"વાવ-થરાદ", en:"Vav-Tharad"}, A:{id:"D02", n:2, gu:"અમદાવાદ", en:"Ahmedabad"}, B:{id:"D03", n:3, gu:"ભાવનગર", en:"Bhavnagar"}, N:{id:"D04", n:4, gu:"નવસારી", en:"Navsari"}};
const STYPE = {G:{n:1, gu:"સરકારી", en:"Government"}, GIA:{n:2, gu:"અનુદાનિત", en:"Grant-in-Aid"}, P:{n:3, gu:"સ્વનિર્ભર (ખાનગી)", en:"Self-Financed (Private)"}};
// Response codes (researcher's rule): 5 = સંપૂર્ણ સહમત ... 1 = સંપૂર્ણ અસહમત; 99 = no response; 98 = invalid (more than one tick)
const SCALE = [[5, "સંપૂર્ણ સહમત", "Strongly agree"], [4, "સહમત", "Agree"], [3, "તટસ્થ", "Neutral"], [2, "અસહમત", "Disagree"], [1, "સંપૂર્ણ અસહમત", "Strongly disagree"]];
const NORESP = 99, INVALID = 98;
const ITEMS = [
  "ગણિતનો તાસ શરૂ થાય તે પહેલાં મને ચિંતા થાય છે.",
  "ગણિતનું નવું પ્રકરણ સમજવામાં મને ચિંતા થાય છે.",
  "શિક્ષક ગણિતનું ગૃહકાર્ય તપાસે ત્યારે હું આત્મવિશ્વાસ અનુભવતો નથી.",
  "શિક્ષક જ્યારે ગણિતનું ગૃહકાર્ય તપાસે ત્યારે મને ગભરામણ થાય છે.",
  "વર્ગમાં શિક્ષક મને મૌખિક રીતે ગણિતનો પ્રશ્ન પૂછે ત્યારે મને ગભરામણ થાય છે.",
  "શિક્ષક ગણિતનો નવો મુદ્દો સમજાવે ત્યારે મને હળવાશ અનુભવાય છે.",
  "ગણિતના તાસમાં મારી મૂંઝવણ રજૂ કરવામાં મને સંકોચ થાય છે.",
  "હું ગણિતના પ્રશ્નો ઉકેલવાનું શરૂ કરવાથી ડરું છું.",
  "ગણિત શીખવામાં મને આનંદ આવે છે.",
  "ગણિતના મુશ્કેલ પ્રશ્નો જોતા જ મને ગભરામણ થાય છે.",
  "ગણિત વિષય વિશે વિચારીને જ મારા મનમાં તણાવ ઊભો થાય છે.",
  "ગણિતના અધૂરા દાખલા ઉકેલવાનો પ્રયત્ન કરવામાં મને આનંદ આવે છે.",
  "ગણિત વિશે વિચારતાં મને ચિંતા થાય છે.",
  "ચિંતાના કારણે ગણિતના પ્રશ્નો સમજવામાં મને મુશ્કેલી પડે છે.",
  "ગણિતની પરીક્ષા નજીક આવે ત્યારે મારી ચિંતા વધતી જાય છે.",
  "મને ગણિતની પરીક્ષામાં દાખલા ખોટા પડવાનો ડર લાગે છે.",
  "ગણિતની પરીક્ષાની આગલી રાત્રે ચિંતાના કારણે મને ઊંઘ આવવામાં તકલીફ પડે છે.",
  "હું ગણિતની પરીક્ષા દરમિયાન સામાન્ય રીતે શાંત રહું છું.",
  "ગણિતની પરીક્ષા વખતે મારા હૃદયના ધબકારા વધી જાય છે અથવા હાથ ધ્રૂજે છે.",
  "ગણિતની પરીક્ષાનું પ્રશ્નપત્ર હાથમાં આવતાં જ મને ચિંતા થાય છે.",
  "પરીક્ષાનું પરિણામ આવ્યા પછી પણ હું સ્વસ્થ રહી શકું છું."];
const POSITIVE = [6, 9, 12, 18, 21];          // calm/enjoyment statements: reverse-scored so that a higher score always = more anxiety
const N = ITEMS.length, MIN_ANS = Math.ceil(0.8 * N);   // scale score only when >= 80% (17 of 21) items answered
const AXV = Array.from({length:N}, (_, i) => "AX" + (i + 1));
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else if (k === "class") el.className = v; else if (k === "hidden") el.hidden = true; else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
const nowIso = () => new Date().toISOString();
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const S = {fb:null, uid:null, role:null, name:"", recs:new Map(), sub:null, cur:null, i:0, flash:null};
const isAns = v => v >= 1 && v <= 5;
function score(i, v){ return isAns(v) ? (POSITIVE.includes(i + 1) ? 6 - v : v) : null; }
function summary(r){
  const sc = AXV.map((v, i) => score(i, r[v])); const got = sc.filter(x => x != null);
  const n = got.length, mean = n >= MIN_ANS ? got.reduce((a, b) => a + b, 0) / n : null;
  return {sc, n, mean, total:n === N ? got.reduce((a, b) => a + b, 0) : null};
}
function setNet(){ const n = $("#net"); const on = navigator.onLine; n.textContent = on ? "✓ ક્લાઉડ જોડાયેલ" : "ઓફલાઇન — ફોનમાં સચવાશે"; n.className = "pill " + (on ? "ok" : "bad"); }
addEventListener("online", setNet); addEventListener("offline", setNet);
function fatal(t, link){ const m = $("#main"); m.textContent = ""; $("#tabs").hidden = true; $("#savebar").hidden = true;
  m.append(h("div", {class:"card"}, h("p", {class:"msg warn"}, t), link ? h("a", {class:"btn primary", href:"./index.html", style:"display:inline-flex;align-items:center;text-decoration:none"}, "મુખ્ય એપ ખોલો →") : null)); }

async function boot(){
  setNet();
  const c = window.FIREBASE_CONFIG || {};
  if (["apiKey", "authDomain", "projectId", "appId"].some(k => !c[k] || /PASTE|YOUR_/i.test(String(c[k])))) return fatal("ક્લાઉડ ગોઠવાયું નથી (firebase-config.js).");
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  let A, U, F;
  try { [A, U, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]); }
  catch (e) { return fatal("Firebase લોડ ન થયું — ઇન્ટરનેટ ચાલુ કરી ફરી ખોલો."); }
  const app = A.initializeApp(c); let db;
  try { db = F.initializeFirestore(app, {localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); } catch (e) { db = F.getFirestore(app); }
  S.fb = {F, U, db, auth:U.getAuth(app)};
  let meUnsub = null;
  U.onAuthStateChanged(S.fb.auth, u => {
    if (meUnsub) { meUnsub(); meUnsub = null; } stopSub(); S.role = null;
    if (!u) return fatal("પ્રવેશ મુખ્ય એપમાં કરો. પ્રવેશ પછી ત્યાં '😟 ચિંતા માપદંડ' દબાવો.", true);
    S.uid = u.uid;
    meUnsub = F.onSnapshot(F.doc(db, "users", u.uid), sn => {
      const d = sn.exists() ? sn.data() : null; const role = d && (d.role === "admin" || d.role === "entry") ? d.role : null;
      if (!role) { stopSub(); S.role = null; return fatal("તમારું ખાતું હજી મંજૂર નથી. સંશોધક મુખ્ય એપના 'એડમિન → ટીમ સભ્યો' માં મંજૂરી આપે પછી અહીં ખૂલશે.", true); }
      S.name = d.name || u.email || "";
      if (role === S.role) return;
      S.role = role; startSub(); renderTabs(); route();
    }, () => fatal("ખાતું વાંચી શકાયું નહીં — ઇન્ટરનેટ તપાસો.", true));
  });
}
function stopSub(){ if (S.sub) { S.sub(); S.sub = null; } S.recs = new Map(); }
function startSub(){
  const {F, db} = S.fb; let q = F.collection(db, "ax_students");
  if (S.role !== "admin") q = F.query(q, F.where("_createdBy", "==", S.uid));
  S.sub = F.onSnapshot(q, sn => { S.recs = new Map(sn.docs.map(d => [d.id, d.data()]));
    const want = location.hash.startsWith("#form-") ? location.hash.slice(6) : "";
    if (["list", "export"].includes(S.view) || (S.view === "form" && want && S.cur && S.cur.AX_ID !== want && S.recs.has(want))) route(); else updateDupNote(); },
                       e => console.warn("list failed", e));
}

function renderTabs(){
  const t = $("#tabs"); t.textContent = ""; t.hidden = false;
  t.append(h("a", {href:"./index.html", style:"background:var(--soft)"}, "← વિદ્યાર્થી ફોર્મ"));
  const tabs = [["form", "ફોર્મ"], ["list", "યાદી"], ["code", "કોડ / ગુણ"]].concat(S.role === "admin" ? [["export", "Export"]] : []);
  for (const [k, l] of tabs) t.append(h("a", {href:"#" + k, "data-k":k}, l));
}
addEventListener("hashchange", () => S.role && route());
function route(){
  const hs = location.hash.slice(1) || "form"; const k = hs.split("-")[0];
  S.view = k; document.querySelectorAll("#tabs a[data-k]").forEach(a => a.classList.toggle("on", a.dataset.k === k));
  $("#savebar").hidden = k !== "form";
  if (k === "list") return viewList();
  if (k === "code") return viewCode();
  if (k === "export" && S.role === "admin") return viewExport();
  const id = hs.startsWith("form-") ? hs.slice(5) : "";
  if (!S.cur || (id && S.cur.AX_ID !== id) || (!id && S.cur.AX_ID)) S.cur = id && S.recs.get(id) ? Object.assign({}, S.recs.get(id)) : blank(S.cur);
  viewForm();
}
function blank(prev){ const r = {AX_ID:"", SCHOOL_ID:prev ? prev.SCHOOL_ID : "", COLLECTION_DATE:prev ? prev.COLLECTION_DATE : today(), ROLL_NO:"", GENDER:null, O23_ID:""}; AXV.forEach(v => r[v] = null); return r; }

// ---------------- form ----------------
function schoolPicker(code, onch){
  const m = CODE_RE.exec(code || "") || [];
  const st = "min-height:44px";
  const sd = h("select", {"data-p":"d", "aria-label":"જિલ્લો", style:st}, h("option", {value:""}, "જિલ્લો"), ...Object.entries(DIST).map(([k, d]) => h("option", {value:k}, k + " · " + d.gu)));
  const stt = h("select", {"data-p":"t", "aria-label":"શાળાનો પ્રકાર", style:st}, h("option", {value:""}, "પ્રકાર"), ...Object.entries(STYPE).map(([k, d]) => h("option", {value:k}, k + " · " + d.gu)));
  const sn = h("select", {"data-p":"n", "aria-label":"શાળા નંબર", style:st}, h("option", {value:""}, "નંબર"), ...Array.from({length:40}, (_, i) => h("option", {value:String(i + 1)}, String(i + 1).padStart(2, "0"))));
  if (m[1]) { sd.value = m[1]; stt.value = m[2]; sn.value = String(Number(m[3])); }
  const fire = () => onch(sd.value && stt.value && sn.value ? `${sd.value}${stt.value}S${sn.value.padStart(2, "0")}` : "");
  [sd, stt, sn].forEach(s => s.addEventListener("change", fire));
  return h("div", {class:"spick"}, sd, stt, sn);
}
function viewForm(){
  const r = S.cur, m = $("#main"); m.textContent = "";
  const editing = !!r.AX_ID;
  if (S.flash) { m.append(h("p", {class:"msg " + S.flash[0]}, S.flash[1])); S.flash = null; }
  const info = h("p", {class:"muted", id:"schInfo"});

async function allocId(code){

  const n = await F.runTransaction(db, async tx => { const x = await tx.get(ref); const cur = x.exists() ? (x.data().n || 0) : 0; tx.set(ref, {n:cur + 1, at:nowIso(), by:S.uid}); return cur + 1; });
  return code + "-X" + String(n).padStart(3, "0");
}

function spss(){
  const lab = (s) => s.replace(/'/g, "''");
  const L = [];
  L.push("* Chauhan Research — Objective 6: Maths Anxiety Scale (21 items). Open Obj6_Anxiety_RAW_*.csv first (File > Import Data > CSV).");
  L.push("* Raw codes: 5 = Strongly agree ... 1 = Strongly disagree; 98 = invalid (multiple ticks); 99 = no response.");
  L.push("VARIABLE LABELS " + AXV.map((v, i) => `${v} '${lab(ITEMS[i])}'`).join("\n  /") + ".");
  L.push("VALUE LABELS AX1 TO AX21 5 'Strongly agree' 4 'Agree' 3 'Neutral' 2 'Disagree' 1 'Strongly disagree' 98 'Invalid' 99 'No response'");
  L.push("  /GENDER 1 'Boy' 2 'Girl'");
  L.push("  /DISTRICT_N 1 'Vav-Tharad' 2 'Ahmedabad' 3 'Bhavnagar' 4 'Navsari'");
  L.push("  /SCHOOL_TYPE 1 'Government' 2 'Grant-in-Aid' 3 'Self-Financed'.");
  L.push("MISSING VALUES AX1 TO AX21 (98, 99).");
  L.push("* Scored items: higher = more anxiety. Positive items " + POSITIVE.join(", ") + " are reverse-scored (6 - code).");
  AXV.forEach((v, i) => L.push(`COMPUTE AXs${i + 1} = ${POSITIVE.includes(i + 1) ? "6 - " + v : v}.`));
  L.push("FORMATS AXs1 TO AXs21 (F1.0).");
  L.push(`COMPUTE N_ANSWERED = NVALID(AXs1 TO AXs21).`);
  L.push(`IF (N_ANSWERED >= ${MIN_ANS}) MAS_MEAN = MEAN(AXs1 TO AXs21).`);
  L.push(`IF (N_ANSWERED = ${N}) MAS_TOTAL = SUM(AXs1 TO AXs21).`);
  L.push("VARIABLE LABELS MAS_MEAN 'Maths anxiety mean score (1-5; higher = more anxiety)' /MAS_TOTAL 'Maths anxiety total (21-105; all items answered)'.");
  L.push("EXECUTE.");
